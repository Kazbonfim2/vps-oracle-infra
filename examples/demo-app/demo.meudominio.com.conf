# Configuracao Nginx para a aplicacao de teste (demo-app)
# Copie para nginx/conf.d/demo.meudominio.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name demo.meudominio.com;

    # Desafio Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy para o container da aplicacao via proxy-net
    location / {
        proxy_pass http://demo-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
